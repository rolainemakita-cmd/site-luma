  <style>
    :root { --fond: #FBF8F6; --poudre: #F0E2DD; --vin: #6E2E3A; --texte: #2A2224; }

    .trait { width: 3rem; height: 2px; background: var(--vin); margin: 2.2rem auto; opacity: .5; }
    h1 { font-weight: 500; font-size: clamp(1.3rem, 4.5vw, 1.7rem); line-height: 1.35; }
    p { margin-top: 1rem; line-height: 1.6; }
    .contact { margin-top: 2.2rem; padding: 1.2rem 1.4rem; background: var(--poudre); border-radius: 4px; }
    a { color: var(--vin); font-weight: 600; text-underline-offset: .2em; }
  </style>
</head>
